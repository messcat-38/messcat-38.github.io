<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>messcat</title>
    <script>
      var path = window.location.pathname.replace(/^\//, "")
      if (path) {
        var params = new URLSearchParams(window.location.search)
        params.set("p", path)
        window.location.replace("/?" + params.toString() + window.location.hash)
      } else {
        window.location.replace("/")
      }
    </script>
  </head>
  <body></body>
</html>
